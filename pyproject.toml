[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "northstar-health-fde"
version = "0.1.0"
description = "Synthetic rapid prototype for AI-assisted prior authorization evidence investigation."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1.0","pydantic>=2.9,<3.0","uvicorn>=0.30,<1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0","httpx>=0.27,<1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
